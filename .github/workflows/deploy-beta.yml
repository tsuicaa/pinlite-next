name: Deploy beta

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pinlite-next-beta-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          project_id: pinlite-510610
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify beta SSH access
        run: |
          gcloud compute ssh pinlite-next-beta \
            --project=pinlite-510610 \
            --zone=us-central1-a \
            --tunnel-through-iap \
            --ssh-key-expire-after=10m \
            --quiet \
            --command="hostname; id -un"